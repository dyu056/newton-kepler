seed: 1

data:
  data_dir: data_cv
  num_trajectories: 10000
  num_points_per_trajectory: 100

model:
  arch: pure_attn
  n_layer: 1
  n_head: 1
  n_embd: 64
  target_std_S: 0.1      # sigma_init = (0.1/(3d))^(1/4) = 0.1511

training:
  block_sizes: [50]
  noise_scale: 0.1
  learning_rate: 0.01
  weight_decay: 0.0
  batch_size: 128
  scale_batch_by_context: true
  n_steps: 30000
  progress_bar: false
  loss_mask: last
  optimizer: gd

probe:
  enabled: true
  verbose: false
  geometry_enabled: false
  frequency: 10
  num_train_samples: 5000
  num_eval_samples: 5000
  schedule:
    - start: 0
      end: 200
      every: 5
    - start: 200
      end: 2000
      every: 50
    - start: 2000
      end: 30000
      every: 500

observe:
  activation_rank:
    enabled: true
  attention_entropy:
    enabled: true
  variance_covariance:
    enabled: false
  singular_values:
    enabled: true
    num_singular_values: 64

regularization:
  variance_covariance:
    enabled: false
    start_step: 1
    target_std: 0.1
    variance_weight: 0.001
    covariance_weight: 0.001
  attention_entropy:
    enabled: false
    weight: 0.01
    start_step: 50

evaluation:
  rollout_enabled: false
