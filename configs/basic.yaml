seed: 1

data:
  data_dir: data_cv
  num_trajectories: 10000
  num_points_per_trajectory: 100

model:
  n_layer: 1
  n_head: 1
  n_embd: 128
training:
  block_sizes: [50]       # chop path -> single target position (rank(Gamma)=1)
  noise_scale: 0.1
  learning_rate: 0.01
  weight_decay: 0.0
  batch_size: 128
  scale_batch_by_context: true
  n_steps: 20000
  progress_bar: false
  loss_mask: last

probe:
  enabled: true
  verbose: false
  geometry_enabled: false
  frequency: 10
  num_train_samples: 5000
  num_eval_samples: 5000
  schedule:
    - start: 0
      end: 200
      every: 5
    - start: 200
      end: 2000
      every: 50
    - start: 2000
      end: 20000
      every: 500

observe:
  activation_rank:
    enabled: true
  attention_entropy:
    enabled: true
    every: 10             # 每 N 步独立测量一次 attention entropy
  attention_matrix:
    enabled: true
    every: 10             # 每 N 步保存一次 attention 矩阵 (T x T)，用于灰度 GIF
  variance_covariance:
    enabled: false        # pure_attn 无 MLP，varcov 不可用
  singular_values:        # 新增
    enabled: true
    num_singular_values: 128

# The values are measured and saved but do not contribute to total_loss.
regularization:
  variance_covariance:
    enabled: false
    start_step: 1
    target_std: 0.1
    variance_weight: 0.001
    covariance_weight: 0.001
  attention_entropy:          # 新增
    enabled: false
    weight: 0.01
    start_step: 50



evaluation:
  rollout_enabled: false
