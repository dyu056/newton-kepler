# Spring SHM benchmark — 1-layer conditional attention
# Pure position: input_dim=1 (x only, no explicit velocity).
# Model infers dynamics from position differences, matching original Kepler setup.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH.
#   python generate_spring_data.py --config configs/spring.yaml
#   python train.py --config configs/spring.yaml --run-name spring_test --gpu 0
seed: 3407

# ── Data generation ──────────────────────────────────────────────
generation:
  total_trajectories: 20000   # must be >= 2 × data.num_trajectories
  num_sample_videos: 8        # .mp4 files rendered for visual check
  fps: 20
  num_frames: 129
  omega_low: 2.2              # rad/s
  omega_high: 6.4
  amplitude_low: 0.10         # normalised coordinates
  amplitude_high: 0.17

# ── Training data ─────────────────────────────────────────────────
data:
  data_dir: data_spring
  num_trajectories: 10000     # per-split (train.py loads 2× this, then 50/50)

# ── Model architecture ────────────────────────────────────────────
model:
  n_layer: 1
  n_head: 1
  n_embd: 128
  input_dim: 1                # 1D position only (no explicit velocity)

# ── Training loop ─────────────────────────────────────────────────
training:
  block_sizes: [2, 5, 20, 50, 100]
  noise_scale: 0.1
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 128
  scale_batch_by_context: true
  n_steps: 2000
  progress_bar: false
  loss_mask: all
  optimizer: gd

# ── Linear probes ─────────────────────────────────────────────────
probe:
  enabled: true
  verbose: false
  geometry_enabled: false
  frequency: 10
  num_train_samples: 5000
  num_eval_samples: 5000
  schedule:
    - start: 0
      end: 200
      every: 5
    - start: 200
      end: 20000
      every: 100

# ── Observables (logged but not in loss) ──────────────────────────
observe:
  activation_rank:
    enabled: true
  attention_entropy:
    enabled: true
  variance_covariance:
    enabled: true
  singular_values:
    enabled: true
    num_singular_values: 5

# ── Regularisation (contribute to total_loss) ─────────────────────
regularization:
  variance_covariance:
    enabled: false
    start_step: 1
    target_std: 0.1
    variance_weight: 0.001
    covariance_weight: 0.001
  attention_entropy:
    enabled: false
    weight: 0.01
    start_step: 50

# ── Evaluation ────────────────────────────────────────────────────
evaluation:
  rollout_enabled: true
