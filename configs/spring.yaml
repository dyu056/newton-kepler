# Spring SHM phase-space benchmark — 1-layer conditional attention
# Uses the same GPTCV model as Kepler, input_dim=2 (x, v)
seed: 3407

data:
  data_dir: data_spring
  num_trajectories: 10000       # train trajectories
  num_frames: 129               # 129 frames @ 20 fps

model:
  n_layer: 1                    # single transformer layer
  n_head: 1                     # single attention head
  n_embd: 128

training:
  block_sizes: [2, 5, 20, 50, 100]  # context lengths to sweep
  noise_scale: 0.1
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 128
  scale_batch_by_context: true
  n_steps: 2000
  progress_bar: false
  loss_mask: all                # predict all tokens
  optimizer: gd                 # full-batch gradient descent

probe:
  enabled: true
  verbose: false
  geometry_enabled: false       # no orbital params for spring
  frequency: 10
  num_train_samples: 5000
  num_eval_samples: 5000
  schedule:
    - start: 0
      end: 200
      every: 5
    - start: 200
      end: 20000
      every: 100

observe:
  activation_rank:
    enabled: true
  attention_entropy:
    enabled: true
  variance_covariance:
    enabled: true
  singular_values:
    enabled: true
    num_singular_values: 5

regularization:
  variance_covariance:
    enabled: false
    start_step: 1
    target_std: 0.1
    variance_weight: 0.001
    covariance_weight: 0.001
  attention_entropy:
    enabled: false
    weight: 0.01
    start_step: 50

evaluation:
  rollout_enabled: true
